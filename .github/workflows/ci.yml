name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # With a lockfile installs are exact; without one (first run) they fall back to a normal install.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      # Lint results are reported but do not fail the build yet.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
