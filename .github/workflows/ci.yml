name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Exact, reproducible installs from package-lock.json. If this step fails because the lockfile is
      # missing, run Actions > "Update lockfile" once.
      - run: npm ci
      # Fails the build when a production dependency has a known high or critical vulnerability.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Lint results are reported but do not fail the build yet.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
